name: Bug report
description: Something in SolidCAM Presetter does not work as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting it. **This repository is public**: leave out customer names, case numbers and paths you cannot share.
  - type: input
    id: version
    attributes:
      label: SolidCAM Presetter version
      description: Help → About shows it.
      placeholder: "1.2.4"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Select the rows in Output and press Copy, then paste them here (without customer names). The full logs are in %LOCALAPPDATA%\SolidCAM Presetter\logs.
      render: text
  - type: input
    id: setup
    attributes:
      label: SolidCAM and SOLIDWORKS versions
      placeholder: SolidCAM 2026 SP2, SOLIDWORKS 2026
